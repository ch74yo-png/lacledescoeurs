
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Découvrez les bijoux et montres LA CLÉ DES CŒURS.">
  <title>Catalogue | LA CLÉ DES CŒURS</title>
  <link rel="stylesheet" href="styles.css?v=20261110-email-nowrap-v17">
  <style>
    .catalogue-page{max-width:1250px;margin:auto;padding:45px 20px 75px}
    .catalogue-heading{text-align:center;margin-bottom:35px}
    .catalogue-heading h1{font:400 clamp(32px,5vw,48px) var(--serif);letter-spacing:2px}
    .catalogue-heading p{color:var(--muted)}
    .catalogue-filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-bottom:25px}
    .catalogue-filters input,.catalogue-filters select{width:100%;min-width:0;padding:13px;border:1px solid var(--line);background:white;color:var(--ink)}
    .catalogue-count{color:var(--muted);font-size:12px;margin-bottom:20px}
    .products-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px 20px}
    .product-card{min-width:0;background:white;border:1px solid var(--line);padding-bottom:18px;text-align:center}
    .product-image{display:flex;width:100%;aspect-ratio:1/1;align-items:center;justify-content:center;overflow:hidden;background:#f3eee7;text-decoration:none}
    .product-image img{width:100%;height:100%;object-fit:contain;display:block}
    .product-image:has(.product-placeholder-logo){background:#f3eee7}
    .product-placeholder-logo{width:68%!important;height:68%!important;object-fit:contain!important;padding:12px;box-sizing:border-box}
    .product-info{padding:15px 12px 0}
    .product-brand{font-size:10px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase}
    .product-name{font:500 19px/1.35 var(--serif);margin:8px 0;color:var(--ink)}
    .product-name a{color:inherit;text-decoration:none}
    .product-price{font-size:15px;margin:10px 0 15px}
    .product-old-price{color:#999;text-decoration:line-through;font-size:12px;margin-right:7px}
    .product-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
    .product-actions button{padding:10px 12px;border:1px solid var(--gold);background:transparent;color:var(--ink);font-size:10px}
    .product-actions button:hover{background:var(--gold);color:white}

    .catalogue-quantity-label{display:flex;justify-content:center;align-items:center;gap:10px;margin:10px auto;font-size:10px;letter-spacing:1px}
    .catalogue-quantity{width:72px;min-height:36px;text-align:center;background:#fff;color:#111;border:1px solid var(--gold);cursor:pointer}
    .product-actions{display:flex;flex-direction:column;gap:7px;max-width:260px;margin:12px auto}
    .product-actions button{width:100%;min-height:38px;padding:9px 10px;border:1px solid var(--gold);background:transparent;color:var(--ink);font-size:10px;letter-spacing:.7px;cursor:pointer;text-transform:uppercase}
    .product-actions button:first-child{background:var(--gold);color:#211916;font-weight:600}

    .no-products{grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)}
    @media(max-width:800px){.products-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.catalogue-filters{grid-template-columns:1fr 1fr}.catalogue-filters input{grid-column:1/-1}}
    @media(max-width:520px){.catalogue-page{padding:30px 12px 50px}.products-grid{gap:15px 9px}.catalogue-filters{grid-template-columns:1fr}.catalogue-filters input{grid-column:auto}.product-info{padding:12px 7px 0}.product-name{font-size:16px}.product-actions button{padding:8px 7px;font-size:9px}}
  </style>
</head>
<body>

<main class="catalogue-page">
  <header class="catalogue-heading">
    <p class="eyebrow">LA CLÉ DES CŒURS</p>
    <h1>Notre collection</h1>
    <p>Découvrez notre sélection de bijoux et de montres fins et raffinés.</p>
  </header>

  <section class="catalogue-filters" aria-label="Filtres du catalogue">
    <input type="search" id="recherche" placeholder="Rechercher un produit ou une marque..." aria-label="Rechercher">
    <select id="filtreCategorie" aria-label="Catégorie">
      <option value="">Toutes les catégories</option>
    </select>
    <select id="triProduits" aria-label="Trier les produits">
      <option value="recent">Ordre d'affichage</option>
      <option value="prix-croissant">Prix croissant</option>
      <option value="prix-decroissant">Prix décroissant</option>
      <option value="nom">Nom A à Z</option>
    </select>
  </section>

  <p class="catalogue-count" id="nombreProduits">Chargement des produits...</p>

  <section class="products-grid" id="listeProduits" aria-live="polite">
    <p class="no-products">Chargement du catalogue...</p>
  </section>
</main>

<script src="categories.js?v=20261110-v1"></script>
<script src="produits.js?v=20261110-catalogue-restaure-v4"></script>
<script>
"use strict";

const listeProduits = document.getElementById("listeProduits");
const recherche = document.getElementById("recherche");
const filtreCategorie = document.getElementById("filtreCategorie");
const triProduits = document.getElementById("triProduits");

const categoriesSite = Array.isArray(window.CDC_CATEGORIES) ? window.CDC_CATEGORIES : [];
categoriesSite.forEach(categorie => {
  const option = document.createElement("option");
  option.value = categorie.id;
  option.textContent = categorie.label;
  filtreCategorie.appendChild(option);
});
const nombreProduits = document.getElementById("nombreProduits");

const params = new URLSearchParams(location.search);
if (params.get("categorie")) filtreCategorie.value = params.get("categorie");
if (params.get("recherche")) recherche.value = params.get("recherche");

function lireStock(cle) {
  try {
    const donnees = JSON.parse(localStorage.getItem(cle) || "[]");
    return Array.isArray(donnees) ? donnees : [];
  } catch {
    return [];
  }
}

function formaterPrix(prix) {
  const montant = Number(prix);
  if (!Number.isFinite(montant)) return "Prix sur demande";
  return new Intl.NumberFormat("fr-FR", {
    style: "currency",
    currency: "EUR"
  }).format(montant);
}

function echapperHTML(texte) {
  return String(texte ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  })[c]);
}

function obtenirProduits() {
  return Array.isArray(window.produits)
    ? window.produits.filter(p => p && p.actif !== false)
    : [];
}

function actualiserCompteurPanier() {
  const compteur = document.getElementById("cartCount");
  if (!compteur) return;
  compteur.textContent = lireStock("cdc_cart").reduce(
    (total, item) => total + Number(item.quantity || 0), 0
  );
}

function afficherProduits() {
  let liste = obtenirProduits();
  const terme = recherche.value.trim().toLowerCase();
  const categorie = filtreCategorie.value;
  const tri = triProduits.value;

  if (terme) {
    liste = liste.filter(p =>
      [p.nom,p.marque,p.reference,p.description]
        .join(" ").toLowerCase().includes(terme)
    );
  }

  if (categorie) {
    liste = liste.filter(p => {
      const categories = Array.isArray(p.categories)
        ? p.categories
        : [p.categorie];
      return categories.includes(categorie);
    });
  }

  if (tri === "prix-croissant") liste.sort((a,b) => Number(a.prix)-Number(b.prix));
  if (tri === "prix-decroissant") liste.sort((a,b) => Number(b.prix)-Number(a.prix));
  if (tri === "nom") liste.sort((a,b) => String(a.nom).localeCompare(String(b.nom),"fr"));

  nombreProduits.textContent = liste.length +
    (liste.length > 1 ? " produits" : " produit");

  if (!liste.length) {
    listeProduits.innerHTML = '<p class="no-products">Aucun produit ne correspond à votre recherche.</p>';
    return;
  }

  listeProduits.innerHTML = liste.map(p => {
    const id = echapperHTML(p.id);
    const nom = echapperHTML(p.nom);
    const marque = echapperHTML(p.marque || "");
    const images = String(p.id) === "bracelet-cartier-love-classic-or-jaune-16-certificat"
      ? Array.from({length:7},(_,i)=>`assets/cartier-love-classic-16-${i+1}.jpg`)
      : (Array.isArray(p.images) ? p.images : (p.image ? [p.image] : []));
    const image = images[0] || (typeof p.image === "string" ? p.image : "");
    const lien = "produit.html?id=" + encodeURIComponent(p.id);
    const logoAttente = '<img class="product-placeholder-logo" src="/logo-officiel.jpg?v=20261110" alt="LA CLÉ DES CŒURS — Depuis 1974 — Bijoux Fins & Raffinés" loading="lazy">';
    const visuel = image
      ? `<img src="${echapperHTML(image)}" alt="${nom}" loading="lazy" referrerpolicy="no-referrer">`
      : logoAttente;

    const ancienPrix = p.ancienPrix
      ? `<span class="product-old-price">${formaterPrix(p.ancienPrix)}</span>`
      : "";

    return `
      <article class="product-card">
        <a href="${lien}" class="product-image">${visuel}</a>
        <div class="product-info">
          <div class="product-brand">${marque}</div>
          <h2 class="product-name"><a href="${lien}">${nom}</a></h2>
          <div class="product-price">${ancienPrix}${formaterPrix(p.prix)}</div>
          <label class="catalogue-quantity-label">QUANTITÉ
            <select class="catalogue-quantity" aria-label="Choisir une quantité"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select>
          </label>
          <div class="product-actions">
            <button type="button" data-action="acheter" data-id="${id}">ACHETER</button>
            <button type="button" data-action="panier" data-id="${id}">AJOUTER AU PANIER</button>
            <button type="button" data-action="favoris" data-id="${id}">♡ AJOUTER AUX FAVORIS</button>
          </div>
        </div>
      </article>
    `;
  }).join("");
}

function ajouterAuPanier(id, quantity = 1) {
  const produit = obtenirProduits().find(p => String(p.id) === String(id));
  if (!produit) return false;

  const panier = lireStock("cdc_cart");
  const existant = panier.find(p => String(p.id) === String(id));

  const quantite = Math.max(1,Math.min(10,Math.floor(Number(quantity)||1)));
  if (existant) {
    existant.quantity = Math.min(10,Number(existant.quantity || 0) + quantite);
  } else {
    panier.push({
      id: produit.id,
      name: produit.nom,
      price: Number(produit.prix),
      quantity: quantite,
      image: (String(produit.id) === "bracelet-cartier-love-classic-or-jaune-16-certificat" ? "assets/cartier-love-classic-16-1.jpg" : produit.image || ""),
      images: String(produit.id) === "bracelet-cartier-love-classic-or-jaune-16-certificat" ? Array.from({length:7},(_,i)=>`assets/cartier-love-classic-16-${i+1}.jpg`) : (Array.isArray(produit.images) ? produit.images : (produit.image ? [produit.image] : []))
    });
  }

  localStorage.setItem("cdc_cart", JSON.stringify(panier));
  actualiserCompteurPanier();
  window.dispatchEvent(new Event("cdc-cart-updated"));
  return true;
}

function ajouterAuxFavoris(id) {
  const produit = obtenirProduits().find(p => String(p.id) === String(id));
  if (!produit) return;

  const favoris = lireStock("cdc_favorites");
  if (favoris.some(p => String(p.id) === String(id))) return;

  favoris.push({
    id: produit.id,
    name: produit.nom,
    price: Number(produit.prix),
    image: produit.image || ""
  });

  localStorage.setItem("cdc_favorites", JSON.stringify(favoris));
  window.dispatchEvent(new Event("cdc-favorites-updated"));
}

// Remplace proprement une image indisponible par le logo officiel.
listeProduits.addEventListener("error", event => {
  const img = event.target;
  if (!(img instanceof HTMLImageElement) || !img.closest(".product-image")) return;
  if (img.classList.contains("product-placeholder-logo")) return;
  img.onerror = null;
  img.src = "/logo-officiel.jpg?v=20261110";
  img.alt = "LA CLÉ DES CŒURS — Depuis 1974 — Bijoux Fins & Raffinés";
  img.classList.add("product-placeholder-logo");
  img.parentElement.classList.add("has-placeholder-logo");
}, true);

listeProduits.addEventListener("click", event => {
  const bouton = event.target.closest("button[data-action]");
  if (!bouton) return;
  const quantityInput=bouton.closest(".product-info")?.querySelector(".catalogue-quantity");
  const quantity=Math.max(1,Math.min(10,Math.floor(Number(quantityInput?.value)||1)));

  if (bouton.dataset.action === "acheter") {
    if (ajouterAuPanier(bouton.dataset.id,quantity)) {
      window.location.assign("commande.html");
    }
    return;
  }
  if (bouton.dataset.action === "panier") ajouterAuPanier(bouton.dataset.id,quantity);
  if (bouton.dataset.action === "favoris") ajouterAuxFavoris(bouton.dataset.id);
});

recherche.addEventListener("input", afficherProduits);
filtreCategorie.addEventListener("change", afficherProduits);
triProduits.addEventListener("change", afficherProduits);

if (Array.isArray(window.produits)) {
  afficherProduits();
  actualiserCompteurPanier();
} else {
  nombreProduits.textContent = "Catalogue indisponible";
  listeProduits.innerHTML = '<p class="no-products">Le fichier produits.js est introuvable ou n’a pas chargé.</p>';
}
</script>

<script src="site-shell.js?v=20261110-language-complete-v18" defer></script>
</body>
</html>
