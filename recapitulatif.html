<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>Récapitulatif | LA CLÉ DES CŒURS</title><link rel="stylesheet" href="styles.css?v=20261110-cart-badges"><style>
.order-page{max-width:850px;margin:35px auto;padding:20px 18px 70px}.order-title{text-align:center;margin:8px 0 30px;font:400 clamp(34px,5vw,47px) var(--serif);letter-spacing:2px}.order-card{padding:25px;margin-bottom:20px;background:#000;border:1px solid #806b4c;color:#fff}.order-ref{text-align:center;padding:15px;border:1px solid #806b4c;margin-bottom:20px;font-size:19px;letter-spacing:2px;color:#d9ad45;overflow-wrap:anywhere}.order-line{display:flex;justify-content:space-between;gap:15px;margin:13px 0;font-size:13px}.order-line strong{text-align:right}.order-total{border-top:1px solid #d9ad45;padding-top:18px;margin-top:20px;font-size:19px;color:#d9ad45}
.promo-box{margin-top:22px;padding-top:18px;border-top:1px solid #806b4c}
.promo-box label{display:block;margin-bottom:9px;color:#e8d8c4;font-size:12px}
.promo-controls{display:flex;gap:9px}
.promo-controls input{flex:1;min-width:0;padding:12px;background:#fffaf4;color:#30231f;border:1px solid #b9a994}
.promo-controls button{padding:12px 16px;background:#d9ad45;color:#000;border:0;font-weight:700;cursor:pointer}
#promoMessage{font-size:12px;line-height:1.6;color:#d9ad45;margin:10px 0 0}.order-button{display:block;width:100%;min-height:52px;margin-top:24px;background:#d9ad45;color:#000;border:0;font-weight:700;letter-spacing:2px;cursor:pointer}.order-button:disabled{opacity:.5}@media(max-width:600px){.order-page{margin:18px auto;padding:12px 13px 45px}.order-card{padding:18px}}
</style></head><body><main class="order-page"><h1 class="order-title">RÉCAPITULATIF</h1><section class="order-card"><div class="order-ref" id="orderRef"></div><div id="customer"></div><div style="border-top:1px solid #806b4c;margin:18px 0"></div><div id="items"></div><div class="order-line"><span>Sous-total</span><strong id="subtotal"></strong></div><div class="order-line"><span>Livraison</span><strong id="shipping"></strong></div><div class="promo-box"><label for="promoCode">CODE PROMOTIONNEL</label><div class="promo-controls"><input id="promoCode" type="text" autocomplete="off" placeholder="Saisir votre code promo"><button id="applyPromo" type="button">APPLIQUER</button></div><p id="promoMessage" aria-live="polite"></p></div><div class="order-line"><span>Réduction</span><strong id="discount"></strong></div><div class="order-line order-total"><span>TOTAL À PAYER</span><strong id="total"></strong></div><button id="continuePay" class="order-button" type="button">PROCÉDER AU PAIEMENT</button></section></main>
<script>
"use strict";
const read=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch{return null}};
const cart=read("cdc_cart")||[],customer=read("cdc_customer")||{},shipping=read("cdc_shipping")||{},promo=read("cdc_promo")||{},ref=localStorage.getItem("cdc_order_reference")||"";
const eur=n=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.getElementById("orderRef").textContent=ref;
const details=[["Nom complet",customer.fullName],["Adresse e-mail",customer.email],["Téléphone",customer.phone],["Adresse",customer.address],["Code postal",customer.postalCode],["Ville",customer.city],["Pays",customer.country]];
document.getElementById("customer").innerHTML=details.map(([k,v])=>'<div class="order-line"><span>'+safe(k)+'</span><strong>'+safe(v||"—")+'</strong></div>').join("");
document.getElementById("items").innerHTML=cart.map(p=>'<div class="order-line"><span>'+safe(p.name||p.nom||"Article")+' × '+Math.max(1,Number(p.quantity)||1)+'</span><strong>'+eur((Number(p.price)||0)*(Number(p.quantity)||1))+'</strong></div>').join("");
const sub=cart.reduce((s,p)=>s+(Number(p.price)||0)*(Number(p.quantity)||1),0),ship=Number(shipping.amount)||0,discount=promo.verified?Number(promo.discount)||0:0,total=Math.max(0,sub+ship-discount);
document.getElementById("subtotal").textContent=eur(sub);document.getElementById("shipping").textContent=eur(ship);document.getElementById("discount").textContent=eur(discount);document.getElementById("total").textContent=eur(total);
const promoInput=document.getElementById("promoCode"),promoMessage=document.getElementById("promoMessage");
promoInput.value=promo.code||"";
promoMessage.textContent=promo.code?"Code enregistré, en attente de vérification lors de la préparation du paiement.":"";
document.getElementById("applyPromo").addEventListener("click",()=>{
 const code=promoInput.value.trim();
 if(!code){promoMessage.textContent="Saisissez un code promotionnel.";return;}
 const current={code,discount:0,verified:false};
 localStorage.setItem("cdc_promo",JSON.stringify(current));
 promo.code=code;promo.discount=0;
 document.getElementById("discount").textContent=eur(0);
 document.getElementById("total").textContent=eur(sub+ship);
 promoMessage.textContent="Code transmis pour vérification par la boutique. Aucune réduction ne sera appliquée tant que sa validité n’est pas confirmée.";
});
document.getElementById("continuePay").addEventListener("click",()=>{if(!cart.length||!customer.email||!ref){alert("Les informations de commande sont incomplètes.");return}location.href="paiement.html"});
</script><script src="site-shell.js?v=20261110-cart-badges" defer></script></body></html>
