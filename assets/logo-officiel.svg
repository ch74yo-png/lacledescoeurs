<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
<title id="title">LA CLÉ DES CŒURS — Depuis 1974</title>
<desc id="desc">Reproduction du logo de la boutique : LA CLÉ sur la première ligne, DES CŒURS sur la deuxième, la clé dorée formant le cœur, Depuis 1974 et BIJOUX FINS ET RAFFINÉS.</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset=".52" stop-color="#d8ad45"/><stop offset="1" stop-color="#a97825"/></linearGradient>
</defs>
<rect width="900" height="310" fill="#211914"/>
<g fill="#f4f0e9" font-family="Arial, Helvetica, sans-serif" font-weight="300" text-anchor="middle">
 <text x="450" y="91" font-size="78" letter-spacing="3">LA CLÉ</text>
 <text x="450" y="190" font-size="76" letter-spacing="3">DES CŒURS</text>
</g>
<!-- Clé dorée intégrée à l'accent du É et son cœur au centre du nom -->
<g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
 <path d="M478 12 L478 118" stroke-width="5"/>
 <path d="M465 31 L489 31 M465 42 L480 42" stroke-width="4"/>
 <path d="M478 112 C464 95 444 98 440 115 C436 132 457 149 478 164 C499 149 520 132 516 115 C512 98 492 95 478 112Z" stroke-width="5"/>
 <path d="M478 164 L478 190" stroke-width="4"/>
</g>
<text x="660" y="226" fill="url(#gold)" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Depuis 1974</text>
<path d="M42 270 H72 M828 270 H858" stroke="url(#gold)" stroke-width="2"/>
<text x="450" y="280" fill="#e8ca79" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" letter-spacing="8" text-anchor="middle">BIJOUX FINS ET RAFFINÉS</text>
</svg>