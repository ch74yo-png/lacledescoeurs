<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">LA CLÉ DES CŒURS — Depuis 1974 — Bijoux Fins &amp; Raffinés</title>
<desc id="desc">Logo noir et or : LA CLÉ, DES CŒURS avec un cœur doré intégré à la clé, Depuis 1974 et Bijoux Fins &amp; Raffinés.</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="0.15" y2="1">
  <stop offset="0" stop-color="#fff1a6"/><stop offset=".28" stop-color="#f3cf55"/>
  <stop offset=".62" stop-color="#d99d12"/><stop offset="1" stop-color="#f8d86a"/>
 </linearGradient>
 <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e9e9e9"/>
 </linearGradient>
</defs>
<rect width="1600" height="900" fill="#171717"/>
<g font-family="Montserrat, Arial, Helvetica, sans-serif" font-weight="700" fill="url(#white)">
 <text x="205" y="280" font-size="190" letter-spacing="5">LA CL</text>
 <text x="205" y="570" font-size="175" letter-spacing="8">DES C</text>
 <text x="895" y="570" font-size="175" letter-spacing="8">EURS</text>
</g>
<!-- Le E doré est dessiné comme une clé, sans modifier les lettres blanches -->
<g fill="none" stroke="url(#gold)" stroke-linecap="square" stroke-linejoin="miter">
 <path d="M760 135 V390" stroke-width="26"/>
 <path d="M760 150 H875 M760 235 H850 M760 320 H875" stroke-width="25"/>
</g>
<!-- Cœur central, avec le petit arceau intégré à sa naissance supérieure -->
<g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
 <path d="M760 485 C705 420 610 432 585 505 C558 584 665 681 760 755 C855 681 962 584 935 505 C910 432 815 420 760 485Z" stroke-width="25"/>
 <path d="M704 450 Q760 393 816 450" stroke-width="23"/>
</g>
<text x="1120" y="680" fill="url(#gold)" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="72" font-weight="700">Depuis 1974</text>
<g stroke="url(#gold)" stroke-width="10">
 <path d="M130 815 H355"/><path d="M1245 815 H1470"/>
</g>
<text x="800" y="845" text-anchor="middle" fill="url(#white)" font-family="Georgia, 'Times New Roman', serif" font-size="74" letter-spacing="2">Bijoux Fins &amp; Raffinés</text>
</svg>