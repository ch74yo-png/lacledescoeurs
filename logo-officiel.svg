<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" role="img" aria-labelledby="logoTitle">
<title id="logoTitle">LA CLE DES CŒURS — Depuis 1974 — Bijoux Fins &amp; Raffinés</title>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe99a"/>
    <stop offset=".42" stop-color="#f8c52b"/>
    <stop offset="1" stop-color="#c9890b"/>
  </linearGradient>
  <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff"/>
    <stop offset="1" stop-color="#eeeae5"/>
  </linearGradient>
</defs>
<!-- Logo vectoriel sur fond transparent : le fond chocolat du site reste apparent. -->
<g font-family="Arial, Helvetica, sans-serif" font-weight="800" fill="url(#white)">
  <text x="65" y="81" font-size="78" letter-spacing="-1.5">LA CL</text>
  <text x="316" y="81" font-size="78" letter-spacing="-1.5" fill="url(#gold)">E</text>
  <text x="0" y="190" font-size="78" letter-spacing="-2">DES C</text>
  <text x="397" y="190" font-size="78" letter-spacing="-2">EURS</text>
</g>
<!-- La hampe du E descend en ligne droite et devient la clé du cœur. -->
<path d="M340 82 V136" stroke="url(#gold)" stroke-width="16" stroke-linecap="butt"/>
<circle cx="340" cy="139" r="16" fill="url(#gold)"/>
<!-- Cœur vertical et symétrique, à la place du O dans CŒURS. -->
<path d="M340 270
 C320 253 278 222 278 188
 C278 157 315 145 340 174
 C365 145 402 157 402 188
 C402 222 360 253 340 270Z"
 fill="none" stroke="url(#gold)" stroke-width="13" stroke-linejoin="round"/>
<path d="M340 164 L326 177 L340 190 L354 177Z" fill="#2b160f"/>
<text x="456" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="37" font-weight="700" fill="url(#gold)">Depuis 1974</text>
<path d="M0 313 H123 M617 313 H740" stroke="url(#gold)" stroke-width="6"/>
<text x="137" y="325" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="url(#white)">Bijoux Fins &amp; Raffinés</text>
</svg>