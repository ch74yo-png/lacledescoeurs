<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#211916">
<title>Finaliser ma commande | LA CLE DES COEURS</title>
<link rel="stylesheet" href="styles.css?v=20261110-noir-or-hero-v1">
<style>
.checkout-page{
  max-width:850px;
  margin:35px auto;
  padding:20px 18px 70px;
}
.checkout-title{text-align:center;margin-bottom:35px}
.checkout-title h1{
  font:400 clamp(34px,5vw,48px) var(--serif);
  letter-spacing:1px;
  margin:8px 0;
}
.checkout-title p:last-child{color:var(--muted)}
.checkout-layout{display:block;width:100%}
.checkout-form{width:100%}
.checkout-card{
  width:100%;
  padding:25px;
  margin-bottom:20px;
  background:#302720;
  border:1px solid rgba(201,164,94,.55);
  color:#f3e8d8;
}
.checkout-card h2{
  margin:0 0 20px;
  color:#e6c58e;
  font:400 23px var(--serif);
  letter-spacing:1px;
}
.checkout-form label:not(.terms-line){
  display:block;
  margin:15px 0 7px;
  color:#e8d8c4;
  font-size:11px;
  letter-spacing:.8px;
}
.checkout-form input:not([type="checkbox"]),
.checkout-form select{
  box-sizing:border-box;
  width:100%;
  min-height:46px;
  padding:12px;
  border:1px solid #b9a994;
  border-radius:2px;
  background:#fffaf4;
  color:#30231f;
  font:13px var(--sans);
}
.checkout-form input:focus,
.checkout-form select:focus{
  outline:1px solid var(--gold);
  border-color:var(--gold);
}
.checkout-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.checkout-line{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin:13px 0;
  color:#f3e8d8;
  font-size:13px;
}
.checkout-line span:last-child{text-align:right}
.checkout-total{
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid var(--gold);
  color:#e8c78e;
  font-size:19px;
  font-weight:600;
}
.checkout-customer-preview{
  margin-bottom:22px;
  padding:15px;
  border:1px solid rgba(201,164,94,.35);
  background:rgba(0,0,0,.12);
  font-size:12px;
  line-height:1.9;
  overflow-wrap:anywhere;
}
.checkout-customer-preview strong{
  display:block;
  margin-bottom:7px;
  color:#e6c58e;
  letter-spacing:1px;
}
.checkout-customer-preview p{margin:2px 0;color:#e9d9c5}
.checkout-promo{
  margin-top:22px;
  padding-top:15px;
  border-top:1px solid rgba(201,164,94,.3);
}
.checkout-promo label{
  display:block;
  margin-bottom:8px;
  color:#e8d8c4;
  font-size:11px;
  letter-spacing:.8px;
}
.checkout-promo input{
  width:100%;
  min-height:44px;
  padding:12px;
  background:#fffaf4;
  color:#30231f;
  border:1px solid #b9a994;
}
.checkout-button{
  display:block;
  width:100%;
  min-height:52px;
  padding:15px;
  margin-top:22px;
  border:0;
  border-radius:1px;
  background:var(--gold);
  color:#211916;
  font-size:12px;
  font-weight:600;
  letter-spacing:3px;
  cursor:pointer;
}
.checkout-button:hover{background:#e2bd75}
.checkout-step-number{text-align:center;color:#e6c58e;font:500 24px var(--sans);letter-spacing:1px;margin:0 0 22px!important}
.checkout-order-reference{text-align:center;margin:0 0 22px;padding:15px;border:1px solid rgba(201,164,94,.4)}
.checkout-order-reference span{display:block;color:#e6c58e;font-size:10px;letter-spacing:1.5px;margin-bottom:8px}
.checkout-order-reference strong{color:#fff;font-size:19px;letter-spacing:2px}
.checkout-item{display:grid;grid-template-columns:minmax(0,1fr) 105px 70px minmax(85px,auto);align-items:center;gap:10px}
.checkout-item-unit{font-size:11px;color:#e8d8c4}
.checkout-item-name{overflow-wrap:anywhere}
.checkout-item-qty{width:86px;min-height:38px;padding:6px;text-align:center;background:#fffaf4;color:#111;border:1px solid #b9a994;cursor:pointer}
@media(max-width:600px){.checkout-item{grid-template-columns:minmax(0,1fr) 72px;gap:8px}.checkout-item-unit{grid-column:1}.checkout-item strong{grid-column:1/-1;text-align:right}}
.checkout-notice{
  margin-top:12px;
  color:#b9a994;
  font-size:11px;
  line-height:1.7;
}
.terms-line{
  display:flex!important;
  align-items:flex-start;
  gap:10px;
  color:#f3e8d8;
  font-size:12px;
  line-height:1.7;
}
.terms-line input{
  width:17px;
  height:17px;
  flex:0 0 17px;
  margin:2px 0 0;
  accent-color:var(--gold);
}
.terms-line a{color:#e6c58e}
.empty-cart{text-align:center;padding:18px;color:#b9a994}
@media(max-width:600px){
  .checkout-page{margin:18px auto;padding:12px 13px 45px}
  .checkout-card{padding:18px}
  .checkout-row{grid-template-columns:1fr;gap:0}
  .checkout-title{margin-bottom:25px}
}
</style>
</head>

<body>
<main class="checkout-page">

  <div class="checkout-title">
    <p class="eyebrow">LA CLE DES COEURS</p>
    <h1>Finaliser ma commande</h1>
    
  </div>

  <div class="checkout-layout">
    <form class="checkout-form" id="checkoutForm">

      <section class="checkout-card">
        <h2 class="checkout-step-number">1</h2>

        <label for="fullName">NOM COMPLET *</label>
        <input id="fullName" name="fullName" type="text" inputmode="text" autocomplete="name" required>

        <label for="email">ADRESSE MAIL *</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" required>

        <label for="phone">TÉLÉPHONE *</label>
        <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" pattern="[0-9+() .-]{6,20}" title="Chiffres uniquement" required>
      </section>

      <section class="checkout-card">
        <h2 class="checkout-step-number">2</h2>

        <label for="country">CHOISIR PAYS *</label>
        <select id="country" name="country"
          autocomplete="country-name" required>
          <option value="">Choisir un pays</option>
        </select>

        <label for="address">ADRESSE *</label>
        <input id="address" name="address" type="text" inputmode="text" autocomplete="street-address" required>

        <div class="checkout-row">
          <div>
            <label for="postalCode">CODE POSTAL *</label>
            <input id="postalCode" name="postalCode" type="text" inputmode="numeric" autocomplete="postal-code" pattern="[0-9]{1,12}" title="Chiffres uniquement" required>
          </div>
          <div>
            <label for="city">VILLE *</label>
            <input id="city" name="city" type="text" inputmode="text" autocomplete="address-level2" required>
          </div>
        </div>
      </section>

      

      <button class="checkout-button" type="submit">CONTINUER</button>

    </form>
  </div>
</main>

<script>
"use strict";
const CART_KEY="cdc_cart",ORDER_REF_KEY="cdc_order_reference",ORDER_SIG_KEY="cdc_order_cart_signature";
let cart=[];try{cart=JSON.parse(localStorage.getItem(CART_KEY)||"[]");if(!Array.isArray(cart))cart=[];}catch{cart=[];}
const countrySelect=document.getElementById("country"),countryNames=new Intl.DisplayNames(["fr"],{type:"region"});
const countries=[];for(let i=65;i<=90;i++){for(let j=65;j<=90;j++){const code=String.fromCharCode(i,j),name=countryNames.of(code);if(name&&name!==code&&!["AC","CP","DG","EA","IC","TA","XK"].includes(code))countries.push({code,name});}}
countries.sort((a,b)=>a.name.localeCompare(b.name,"fr"));countries.forEach(c=>{const o=document.createElement("option");o.value=c.code;o.textContent=c.name;countrySelect.appendChild(o);});
try{const preferred=new Intl.Locale(navigator.language||"fr-FR").region||"FR";if(preferred&&countries.some(c=>c.code===preferred))countrySelect.value=preferred;}catch{}
const europe=new Set("AT BE BG HR CY CZ DK EE FI FR DE GR HU IS IE IT LV LI LT LU MT MC NL NO PL PT RO SM SK SI ES SE CH GB".split(" ")),northAmerica=new Set(["US","CA"]),asiaOceania=new Set("AU NZ JP SG KR HK TW".split(" "));
function shippingFor(code){if(!code)return null;if(code==="GH"||["NG","ZA","KE","UG","TZ","RW","SN","CI","CM","MA","TN","EG"].includes(code))return null;if(europe.has(code))return 15.62;if(northAmerica.has(code))return 39.90;if(asiaOceania.has(code))return 49.90;return 59.90;}
function signature(){return cart.map(p=>String(p.id)+":"+Math.max(1,Number(p.quantity)||1)).sort().join("|");}
function orderReference(){const sig=signature();let ref=localStorage.getItem(ORDER_REF_KEY);if(!ref||localStorage.getItem(ORDER_SIG_KEY)!==sig){const alphabet="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",bytes=new Uint8Array(8);crypto.getRandomValues(bytes);ref="CDC-"+Array.from(bytes,b=>alphabet[b%alphabet.length]).join("");localStorage.setItem(ORDER_REF_KEY,ref);localStorage.setItem(ORDER_SIG_KEY,sig);}return ref;}
const value=id=>document.getElementById(id).value.trim(),escapeHtml=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function preview(){
 const values=["fullName","email","phone","address","postalCode","city"].map(value);
 const country=countrySelect.value?countrySelect.options[countrySelect.selectedIndex].textContent:"";
 const all=[...values,country].filter(v=>v);
 document.getElementById("step3Preview").textContent=all.join(" · ");
}
document.querySelectorAll("#checkoutForm input,#checkoutForm select").forEach(el=>el.addEventListener("input",preview));countrySelect.addEventListener("change",preview);
document.getElementById("checkoutForm").addEventListener("submit",event=>{event.preventDefault();const form=event.currentTarget;if(!cart.length){alert("Votre panier est vide.");return;}if(!form.reportValidity())return;const shipping=shippingFor(countrySelect.value);if(shipping===null){alert("La livraison n'est pas disponible pour ce pays. Veuillez contacter la boutique.");return;}const countryName=countrySelect.options[countrySelect.selectedIndex].textContent;localStorage.setItem("cdc_customer",JSON.stringify({fullName:value("fullName"),email:value("email"),phone:value("phone"),address:value("address"),postalCode:value("postalCode"),city:value("city"),country:countryName,countryCode:countrySelect.value}));localStorage.setItem(ORDER_REF_KEY,orderReference());localStorage.setItem("cdc_shipping",JSON.stringify({amount:shipping,currency:"EUR"}));localStorage.setItem("cdc_promo",JSON.stringify({code:"",discount:0,verified:false}));window.location.assign("recapitulatif.html");});
preview();
</script>

<script src="site-shell.js?v=20261110-home-grid-cart-fix-v5" defer></script>
</body>
</html>
