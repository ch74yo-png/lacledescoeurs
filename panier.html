<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Votre panier LA CLÉ DES CŒURS.">
  <title>Mon panier | LA CLÉ DES CŒURS</title>
  <link rel="stylesheet" href="styles.css?v=20261110-black-final-v7">
  <style>
    .cart-page {
      max-width: 1050px;
      margin: auto;
      padding: 55px 5% 75px;
    }
    .cart-page h1 {
      text-align: center;
      font: 400 46px var(--serif);
      color: var(--ink);
      margin: 8px 0 35px;
    }
    .cart-list {
      display: grid;
      gap: 15px;
    }
    .cart-item {
      display: grid;
      grid-template-columns: 110px minmax(0,1fr) auto;
      align-items: center;
      gap: 22px;
      padding: 18px;
      background: var(--white);
      border: 1px solid var(--line);
    }
    .cart-item-image {
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3eee7;
      overflow: hidden;
    }
    .cart-item-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .cart-item h2 {
      font: 500 23px var(--serif);
      color: var(--ink);
      margin: 0 0 7px;
    }
    .cart-item-price {
      color: var(--muted);
      font-size: 13px;
    }
    .cart-item-actions {
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: 9px;
    }
    .cart-item input {
      width: 68px;
      padding: 9px;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      text-align: center;
    }
    .cart-remove {
      border: 0;
      background: transparent;
      color: #956b70;
      cursor: pointer;
      text-decoration: underline;
      font-size: 12px;
    }
    .cart-summary {
      max-width: 440px;
      margin: 30px 0 0 auto;
      padding: 25px;
      background: var(--white);
      border: 1px solid var(--line);
    }
    .cart-total {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      font-size: 18px;
      margin-bottom: 18px;
    }
    .cart-checkout {
      display: block;
      text-align: center;
      padding: 15px;
      background: var(--brown);
      color: white;
      text-decoration: none;
      letter-spacing: 1.5px;
      font-size: 11px;
    }
    .cart-checkout:hover {
      background: var(--gold);
    }
    .cart-empty {
      text-align: center;
      padding: 45px 15px;
      background: var(--white);
      border: 1px solid var(--line);
    }
    .cart-empty h2 {
      font: 400 28px var(--serif);
    }
    .cart-empty p {
      color: var(--muted);
    }
    .cart-item-subtotal {
      margin-top: 7px;
      font-weight: 600;
      font-size: 14px;
    }
    @media(max-width:600px) {
      .cart-page {
        padding: 35px 12px 50px;
      }
      .cart-page h1 {
        font-size: 37px;
      }
      .cart-item {
        grid-template-columns: 75px minmax(0,1fr);
        gap: 12px;
        padding: 12px;
      }
      .cart-item-image {
        width: 75px;
        height: 75px;
      }
      .cart-item h2 {
        font-size: 19px;
      }
      .cart-item-actions {
        grid-column: 2;
        flex-direction: row;
        justify-content: flex-start;
      }
      .cart-summary {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
<main class="cart-page">
  <p class="eyebrow" style="text-align:center">LA CLÉ DES CŒURS</p>
  <h1>Mon panier</h1>
  <div id="cartContents" class="cart-list"></div>
  <div id="cartSummary" class="cart-summary" hidden>
    <div class="cart-total">
      <strong>Total provisoire</strong>
      <strong id="cartTotal">0,00 €</strong>
    </div>
    <p style="font-size:11px;margin-bottom:18px;color:var(--muted)">
      Les frais de livraison seront calculés avant validation de la commande.
    </p>
    <a href="commande.html" class="cart-checkout">
      CONTINUER VERS LA COMMANDE
    </a>
  </div>
</main>
<script>
"use strict";
const cartContents = document.getElementById("cartContents");
const cartSummary = document.getElementById("cartSummary");
const cartTotal = document.getElementById("cartTotal");
function lirePanier() {
  try {
    const panier = JSON.parse(localStorage.getItem("cdc_cart") || "[]");
    const valides = Array.isArray(panier) ? panier.filter(article =>
      article && typeof article === "object" &&
      (article.name || article.nom) &&
      Number.isFinite(Number(article.price ?? article.prix)) &&
      Number(article.price ?? article.prix) >= 0
    ) : [];
    if (JSON.stringify(valides) !== JSON.stringify(panier)) {
      localStorage.setItem("cdc_cart", JSON.stringify(valides));
    }
    return valides;
  } catch {
    return [];
  }
}
function enregistrerPanier(panier) {
  localStorage.setItem("cdc_cart", JSON.stringify(panier));
  window.dispatchEvent(new Event("cdc-cart-updated"));
  afficherPanier();
}
function prixArticle(article) {
  return Number(article.price ?? article.prix ?? 0);
}
function nomArticle(article) {
  return article.name || article.nom || "Article";
}
function imageArticle(article) {
  return article.image || article.photo || "";
}
function quantiteArticle(article) {
  return Math.min(10, Math.max(1, Number(article.quantity) || 1));
}
function formaterPrix(prix) {
  return Number(prix).toLocaleString("fr-FR", {
    style: "currency",
    currency: "EUR"
  });
}
function afficherPanier() {
  const panier = lirePanier();
  cartContents.replaceChildren();
  if (!panier.length) {
    cartContents.innerHTML = `
      <div class="cart-empty">
        <h2>Votre panier est vide</h2>
        <p>Découvrez notre sélection de bijoux et de montres.</p>
        <a class="primary-button" href="catalogue.html">
          DÉCOUVRIR LE CATALOGUE
        </a>
      </div>
    `;
    cartSummary.hidden = true;
    actualiserCompteur();
    return;
  }
  let total = 0;
  panier.forEach((article, index) => {
    const prix = prixArticle(article);
    const quantite = quantiteArticle(article);
    if (!Number.isFinite(prix) || prix < 0) return;
    const sousTotal = prix * quantite;
    total += sousTotal;
    const ligne = document.createElement("article");
    ligne.className = "cart-item";
    const imageConteneur = document.createElement("div");
    imageConteneur.className = "cart-item-image";
    const urlImage = imageArticle(article);
    if (urlImage) {
      const image = document.createElement("img");
      image.src = urlImage;
      image.alt = nomArticle(article);
      image.loading = "lazy";
      image.addEventListener("error", () => {
        imageConteneur.textContent = "Photo indisponible";
      });
      imageConteneur.appendChild(image);
    } else {
      imageConteneur.textContent = "CDC";
    }
    const details = document.createElement("div");
    const titre = document.createElement("h2");
    titre.textContent = nomArticle(article);
    const prixTexte = document.createElement("p");
    prixTexte.className = "cart-item-price";
    prixTexte.textContent = formaterPrix(prix) + " l'unité";
    const sousTotalTexte = document.createElement("p");
    sousTotalTexte.className = "cart-item-subtotal";
    sousTotalTexte.textContent = "Sous-total : " + formaterPrix(sousTotal);
    details.append(titre, prixTexte, sousTotalTexte);
    const actions = document.createElement("div");
    actions.className = "cart-item-actions";
    const quantityInput = document.createElement("select");
    quantityInput.setAttribute("aria-label", "Quantité de " + nomArticle(article));
    for (let q = 1; q <= 10; q++) {
      const option = document.createElement("option");
      option.value = String(q);
      option.textContent = String(q);
      if (q === quantiteArticle(article)) option.selected = true;
      quantityInput.appendChild(option);
    }
    quantityInput.addEventListener("change", () => {
      const panierMisAJour = lirePanier();
      if (!panierMisAJour[index]) return;
      panierMisAJour[index].quantity = Math.min(
        10,
        Math.max(1, Number(quantityInput.value) || 1)
      );
      enregistrerPanier(panierMisAJour);
    });
    const supprimer = document.createElement("button");
    supprimer.type = "button";
    supprimer.className = "cart-remove";
    supprimer.textContent = "Supprimer";
    supprimer.addEventListener("click", () => {
      const panierMisAJour = lirePanier();
      panierMisAJour.splice(index, 1);
      enregistrerPanier(panierMisAJour);
    });
    actions.append(quantityInput, supprimer);
    ligne.append(imageConteneur, details, actions);
    cartContents.appendChild(ligne);
  });
  cartTotal.textContent = formaterPrix(total);
  cartSummary.hidden = total <= 0;
  actualiserCompteur();
}
function actualiserCompteur() {
  const compteur = document.getElementById("cartCount");
  if (!compteur) return;
  const total = lirePanier().reduce(
    (sum, article) => sum + quantiteArticle(article),
    0
  );
  compteur.textContent = total ? String(total) : "";
  compteur.hidden = total === 0;
}
window.addEventListener("storage", afficherPanier);
window.addEventListener("cdc-cart-updated", actualiserCompteur);
afficherPanier();
</script>
<script src="site-shell.js?v=20261110-hero-realimg-v9" defer></script>
</body>
</html>
