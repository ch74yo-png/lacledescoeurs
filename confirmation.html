<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>Confirmation de commande | LA CLÉ DES CŒURS</title><link rel="stylesheet" href="styles.css?v=20261112-fixe-v22"><style>.confirmation-page{max-width:760px;margin:55px auto;padding:20px 18px 70px}.confirmation-card{text-align:center;padding:38px 24px;border:1px solid #806b4c;background:#000;color:#fff}.confirmation-card h1{font:400 clamp(30px,5vw,44px) var(--serif);color:#d9ad45}.confirmation-card p{line-height:1.8}.confirmation-ref{margin:22px 0;padding:15px;border:1px solid #806b4c;color:#d9ad45;overflow-wrap:anywhere}.confirmation-home{display:inline-block;margin-top:18px;padding:14px 25px;background:#d9ad45;color:#000;text-decoration:none;letter-spacing:1px}.confirmation-error{color:#ffb2a8}.confirmed-items{margin:20px 0;text-align:left}.confirmed-item{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #806b4c}.confirmed-item img{width:76px;height:76px;object-fit:contain;background:#111}.confirmed-item span{font-size:13px}@media(max-width:600px){.confirmation-page{margin:20px auto;padding:12px}}</style></head><body><main class="confirmation-page"><section class="confirmation-card"><h1 id="statusTitle">VÉRIFICATION DU PAIEMENT</h1><p id="statusText">Nous vérifions votre paiement auprès de notre prestataire.</p><div class="confirmation-ref" id="orderRef"></div><div id="confirmedItems" class="confirmed-items"></div><a class="confirmation-home" href="index.html">RETOUR À L’ACCUEIL</a></section></main><script>
"use strict";
const bankTransferParams=new URLSearchParams(location.search);
if(bankTransferParams.get("mode")==="bank-transfer"){
 const reference=bankTransferParams.get("reference")||"";
 document.getElementById("statusTitle").textContent="VÉRIFICATION DE LA DÉCLARATION";
 document.getElementById("statusText").textContent="Nous vérifions l'enregistrement de votre déclaration auprès de notre serveur.";
 document.getElementById("orderRef").textContent=reference?"Référence de commande : "+reference:"Référence de commande indisponible";
 document.getElementById("confirmedItems").textContent="";
}
const API="https://cdc-paiement-api.bagzful.workers.dev";
const sessionId=new URLSearchParams(location.search).get("session_id");
const ref=localStorage.getItem("cdc_order_reference")||"";
document.getElementById("orderRef").textContent=ref?"N° "+ref:"N° indisponible";
(async()=>{
 const title=document.getElementById("statusTitle"),message=document.getElementById("statusText");
 if(bankTransferParams.get("mode")==="bank-transfer"){
  const reference=bankTransferParams.get("reference")||"";
  try{
   if(!reference)throw new Error("Référence de commande absente.");
   const response=await fetch(API+"/bank-transfer-status?reference="+encodeURIComponent(reference));
   const data=await response.json();
   if(!response.ok)throw new Error(data.erreur||"Vérification impossible.");
   title.textContent="VIREMENT DÉCLARÉ";
   message.textContent="Votre déclaration a bien été enregistrée. Votre commande reste en attente de vérification et ne sera confirmée qu'après réception effective des fonds sur le compte bancaire.";
   document.getElementById("orderRef").textContent="Référence de commande : "+data.orderReference;
   document.getElementById("confirmedItems").textContent="Statut : VIREMENT EN ATTENTE DE VÉRIFICATION";
  }catch(error){
   title.textContent="DÉCLARATION NON VÉRIFIÉE";
   message.textContent=error.message||"La déclaration n'a pas pu être retrouvée sur le serveur. Contactez la boutique avant de refaire un virement.";
   message.className="confirmation-error";
  }
  return;
 }
 if(!sessionId){title.textContent="PAIEMENT NON VÉRIFIÉ";message.textContent="Aucune référence de paiement n’a été reçue. Votre commande n’est pas encore confirmée.";message.className="confirmation-error";return}
 try{
  const response=await fetch(API+"/checkout-session?session_id="+encodeURIComponent(sessionId));
  const data=await response.json();
  if(!response.ok)throw new Error(data.erreur||"Vérification impossible.");
  if(data.payment_status==="paid"){
   const read=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch{return null}};
   const cart=read("cdc_cart")||[],shipping=read("cdc_shipping")||{};
   let orders=[];try{orders=JSON.parse(localStorage.getItem("cdc_orders")||"[]");if(!Array.isArray(orders))orders=[];}catch{orders=[];}
   if(!orders.some(order=>order.sessionId===sessionId)){
    const subtotal=cart.reduce((sum,item)=>sum+(Number(item.price)||0)*(Number(item.quantity)||1),0);
    orders.push({sessionId,reference:ref,date:new Date().toISOString(),items:cart.map(item=>({name:item.name||item.nom||"Article",quantity:Number(item.quantity)||1,price:Number(item.price)||0,image:item.image||(Array.isArray(item.images)?item.images[0]:"")||item.photo||""})),total:Number(data.amount_total)!=0?Number(data.amount_total)/100:subtotal+(Number(shipping.amount)||0),status:"paid"});
    localStorage.setItem("cdc_orders",JSON.stringify(orders));
   }
   document.getElementById("confirmedItems").innerHTML=cart.map(item=>{const image=item.image||(Array.isArray(item.images)?item.images[0]:"")||item.photo||"";return '<div class="confirmed-item">'+(image?'<img src="'+String(image).replace(/["&<>']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))+'" alt="">':'<div></div>')+'<span>'+String(item.name||item.nom||"Article")+' × '+(Number(item.quantity)||1)+'</span><strong>'+new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"}).format(Number(item.price)||0)+'</strong></div>'}).join("");
   title.textContent="PAIEMENT RÉUSSI";
   message.textContent="Vous avez bien reçu votre commande. Votre facture sera envoyée à l’adresse e-mail indiquée lors de la commande.";
   localStorage.removeItem("cdc_cart");localStorage.removeItem("cdc_shipping");localStorage.removeItem("cdc_promo");localStorage.removeItem("cdc_order_reference");localStorage.removeItem("cdc_order_cart_signature");
  }else{
   title.textContent="PAIEMENT EN ATTENTE";
   message.textContent="Le paiement n’est pas encore confirmé. Votre commande ne peut pas encore être considérée comme payée.";
   message.className="confirmation-error";
  }
 }catch(error){title.textContent="VÉRIFICATION IMPOSSIBLE";message.textContent=error.message||"Veuillez contacter la boutique.";message.className="confirmation-error"}
})();
</script><script src="site-shell.js?v=20261110-language-complete-v18" defer></script></body></html>
