<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Votre espace client LA CLÉ DES CŒURS.">
  <title>Mon compte | LA CLÉ DES CŒURS</title>
  <link rel="stylesheet" href="styles.css?v=20261110-black-theme">
  <style>
    .account-page {
      max-width: 850px;
      margin: auto;
      padding: 55px 20px 75px;
    }
    .account-heading {
      text-align: center;
      margin-bottom: 35px;
    }
    .account-heading h1 {
      font: 400 clamp(34px, 5vw, 46px) var(--serif);
      color: var(--ink);
      margin: 10px 0;
    }
    .account-card {
      padding: 28px;
      margin-bottom: 20px;
      background: var(--white);
      border: 1px solid var(--line);
    }
    .account-card h2 {
      font: 400 25px var(--serif);
      margin: 0 0 22px;
      color: var(--ink);
    }
    .account-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .account-field {
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      min-width: 0;
    }
    .account-field label {
      display: block;
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 7px;
    }
    .account-field p {
      margin: 0;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-size: 14px;
    }
    .account-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 25px;
    }
    .account-button {
      display: inline-block;
      padding: 14px 20px;
      border: 1px solid var(--gold);
      background: var(--brown);
      color: white;
      text-decoration: none;
      text-align: center;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
    }
    .account-button.secondary {
      background: transparent;
      color: var(--ink);
    }
    .account-empty {
      text-align: center;
      padding: 25px 10px;
      color: var(--muted);
      line-height: 1.8;
    }
    .account-notice {
      margin-top: 18px;
      font-size: 11px;
      line-height: 1.7;
      color: var(--muted);
    }
    @media(max-width:550px) {
      .account-page {
        padding: 35px 14px 50px;
      }
      .account-card {
        padding: 20px 16px;
      }
      .account-details {
        grid-template-columns: 1fr;
        gap: 15px;
      }
      .account-actions {
        flex-direction: column;
      }
      .account-button {
        width: auto;
      }
    }
  </style>
</head>
<body>
<main class="account-page">
  <header class="account-heading">
    <p class="eyebrow">LA CLÉ DES CŒURS</p>
    <h1>Mon compte</h1>
    <p>Retrouvez les coordonnées enregistrées lors de votre commande.</p>
  </header>
  <section class="account-card">
    <h2>Mes coordonnées</h2>
    <div id="accountContent">
      <div class="account-empty">
        Chargement de vos informations...
      </div>
    </div>
  </section>
  <section class="account-card">
    <h2>Ma boutique</h2>
    <div class="account-actions">
      <a class="account-button" href="catalogue.html">
        DÉCOUVRIR LE CATALOGUE
      </a>
      <a class="account-button secondary" href="favoris.html">
        MES FAVORIS
      </a>
      <a class="account-button secondary" href="panier.html">
        MON PANIER
      </a>
    </div>
  </section>
</main>
<script>
"use strict";
const accountContent = document.getElementById("accountContent");
function lireCoordonnees() {
  try {
    const donnees = JSON.parse(
      localStorage.getItem("cdc_customer") || "null"
    );
    return donnees && typeof donnees === "object"
      ? donnees
      : null;
  } catch {
    return null;
  }
}
function afficherChamp(label, valeur) {
  const conteneur = document.createElement("div");
  conteneur.className = "account-field";
  const titre = document.createElement("label");
  titre.textContent = label;
  const texte = document.createElement("p");
  texte.textContent = valeur || "Non renseigné";
  conteneur.append(titre, texte);
  return conteneur;
}
function afficherCompte() {
  const client = lireCoordonnees();
  accountContent.replaceChildren();
  if (!client) {
    const message = document.createElement("div");
    message.className = "account-empty";
    const texte = document.createElement("p");
    texte.textContent =
      "Aucune coordonnée n'est encore enregistrée.";
    const lien = document.createElement("a");
    lien.href = "catalogue.html";
    lien.className = "account-button";
    lien.textContent = "DÉCOUVRIR LA BOUTIQUE";
    message.append(texte, lien);
    accountContent.appendChild(message);
    return;
  }
  const grille = document.createElement("div");
  grille.className = "account-details";
  grille.append(
    afficherChamp("NOM COMPLET", client.fullName),
    afficherChamp("ADRESSE MAIL", client.email),
    afficherChamp("TÉLÉPHONE", client.phone),
    afficherChamp("PAYS", client.country),
    afficherChamp("ADRESSE", client.address),
    afficherChamp("COMPLÉMENT D'ADRESSE", client.addressExtra),
    afficherChamp("CODE POSTAL", client.postalCode),
    afficherChamp("VILLE", client.city)
  );
  const actions = document.createElement("div");
  actions.className = "account-actions";
  const modifier = document.createElement("a");
  modifier.href = "commande.html";
  modifier.className = "account-button";
  modifier.textContent = "PASSER UNE COMMANDE";
  actions.appendChild(modifier);
  const notice = document.createElement("p");
  notice.className = "account-notice";
  notice.textContent =
    "Ces coordonnées sont enregistrées dans le navigateur de cet appareil. " +
    "Cette page ne constitue pas encore un compte client avec connexion sécurisée.";
  accountContent.append(grille, actions, notice);
}
afficherCompte();
</script>
<script src="site-shell.js?v=20261110-black-logo" defer></script>
</body>
</html>
