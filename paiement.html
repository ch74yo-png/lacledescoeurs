<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#211916">
<title>Paiement | LA CLE DES COEURS</title>
<link rel="stylesheet" href="styles.css?v=20261112-choix-paiement-v24">
<script src="https://js.stripe.com/endive/stripe.js"></script>

<style>
.payment-page{
  max-width:850px;
  margin:35px auto;
  padding:20px 18px 70px;
}
.payment-title{text-align:center;margin-bottom:32px}
.payment-title h1{
  font:400 clamp(34px,5vw,47px) var(--serif);
  letter-spacing:2px;
  margin:8px 0;
}
.payment-title p:last-child{color:var(--muted)}
.payment-grid{display:block;width:100%}
.payment-card{
  width:100%;
  padding:25px;
  margin-bottom:20px;
  background:#302720;
  border:1px solid rgba(201,164,94,.55);
  color:#f3e8d8;
}
.payment-card h2{
  font:400 23px var(--serif);
  margin:0 0 20px;
  color:#e6c58e;
}
.payment-line{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin:13px 0;
  font-size:13px;
  color:#f3e8d8;
}
.payment-line strong{
  text-align:right;
  overflow-wrap:anywhere;
}
.payment-total{
  border-top:1px solid var(--gold);
  padding-top:18px;
  margin-top:20px;
  font-size:19px;
  color:#e8c78e;
}
.payment-section-intro{display:none}

.payment-choices{display:grid;gap:12px;margin:8px 0 22px}
.payment-choice{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid rgba(201,164,94,.55);background:rgba(0,0,0,.28);cursor:pointer;color:#f3e8d8}
.payment-choice:has(input:checked){border-color:var(--gold);background:rgba(201,164,94,.12)}
.payment-choice input{width:19px;height:19px;flex:0 0 19px;accent-color:var(--gold)}
.payment-choice-copy{display:grid;gap:5px}
.payment-choice-copy strong{font-size:15px;color:#e6c58e}
.payment-choice-copy small{font-size:12px;line-height:1.5;color:#d5c8b8}

#payment-element{
  margin:18px 0 25px;
  min-height:100px;
}
.pay-button{
  display:block;
  width:100%;
  min-height:52px;
  padding:16px;
  border:0;
  background:var(--gold);
  color:#211916;
  letter-spacing:3px;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
}
.pay-button:hover{background:#e2bd75}
.pay-button:disabled{opacity:.5;cursor:not-allowed}
.payment-message:empty{display:none}
.payment-message{
  font-size:12px;
  line-height:1.7;
  margin:15px 0;
  color:#c8b9a7;
}
.payment-error{color:#ffaaa0}
.payment-success{text-align:center;padding:35px 20px}
.payment-success h2{
  font:400 30px var(--serif);
}
.payment-success a{
  display:inline-block;
  margin-top:20px;
  padding:13px 25px;
  background:var(--gold);
  color:#211916;
  text-decoration:none;
  letter-spacing:1px;
  font-size:11px;
}
.payment-reference{
  padding:13px;
  margin:18px 0;
  border:1px solid rgba(201,164,94,.4);
  color:#e6c58e;
  overflow-wrap:anywhere;
}
[hidden]{display:none!important}
@media(max-width:600px){
  .payment-page{margin:18px auto;padding:12px 13px 45px}
  .payment-card{padding:18px}
}
 .payment-product-line{display:grid;grid-template-columns:76px minmax(0,1fr) auto;align-items:center;gap:12px}.payment-product-image{width:76px;height:76px;object-fit:contain;background:#111}@media(max-width:520px){.payment-product-line{grid-template-columns:58px minmax(0,1fr) auto}.payment-product-image{width:58px;height:58px}}\n</style>
</head>

<body>

<main class="payment-page">

  <div class="payment-title">
    <p class="eyebrow">BIENVENUE CHEZ LA CLE DES COEURS</p>
    <h1>MODE DE PAIEMENT</h1>
  </div>

  <div id="successPanel" class="payment-card payment-success" hidden>
    <h2>Merci pour votre commande</h2>
    <div class="payment-reference" id="successReference"></div>
    <p id="successMessage">Vérification de votre paiement...</p>
    <a href="index.html">RETOUR À L'ACCUEIL</a>
  </div>

  <div id="paymentContent" class="payment-grid">

    <section class="payment-card">
      <div class="payment-section-intro" aria-hidden="true"></div>

      <div class="payment-choices" role="radiogroup" aria-label="Choisissez votre moyen de paiement">
        <label class="payment-choice">
          <input type="radio" name="cdcPaymentMethod" value="card">
          <span class="payment-choice-copy"><strong>Carte bancaire</strong><small>Visa, Mastercard, American Express et Apple Pay si disponible sur votre appareil</small></span>
        </label>
        <label class="payment-choice">
          <input type="radio" name="cdcPaymentMethod" value="customer_balance">
          <span class="payment-choice-copy"><strong>Virement bancaire</strong><small>Coordonnées bancaires et référence de virement fournies par Stripe</small></span>
        </label>
      </div>

      <label class="payment-terms" style="display:flex;gap:10px;align-items:flex-start;margin:18px 0;color:#fff;font-size:12px"><input id="acceptPaymentTerms" type="checkbox" style="width:17px;height:17px;accent-color:#d9ad45"><span>J’accepte les <a href="conditions-generales.html" target="_blank" style="color:#d9ad45">conditions générales d’achat et de vente</a>.</span></label>
      <p id="paymentMessage" class="payment-message">
        
      </p>

      <button id="payButton" class="pay-button" type="button" disabled>PAYER</button>
    </section>

  </div>
</main>

<script>
"use strict";

const API = "https://cdc-paiement-api.bagzful.workers.dev";
const money = cents => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"}).format(Number(cents||0)/100);
function readStorage(key) {
  try { return JSON.parse(localStorage.getItem(key)||"null"); }
  catch { return null; }
}

const cart = readStorage("cdc_cart") || [];
const customer = readStorage("cdc_customer") || {};
const promo = readStorage("cdc_promo") || {};
const orderReference = localStorage.getItem("cdc_order_reference") || "";
const payButton = document.getElementById("payButton");
const message = document.getElementById("paymentMessage");
const terms = document.getElementById("acceptPaymentTerms");
const methodInputs = [...document.querySelectorAll('input[name="cdcPaymentMethod"]')];
let busy = false;

function selectedMethod() {
  return methodInputs.find(input => input.checked)?.value || "";
}

function updateButton() {
  payButton.disabled = busy || !terms.checked || !selectedMethod();
}

function showError(error) {
  message.textContent = error;
  message.classList.add("payment-error");
  payButton.disabled = false;
  busy = false;
  updateButton();
}

function validateOrder() {
  if (!Array.isArray(cart) || !cart.length) throw new Error("Votre panier est vide.");
  if (!customer.email || !customer.fullName || !customer.phone ||
      !customer.address || !customer.postalCode || !customer.city ||
      !customer.countryCode) {
    throw new Error("Vos coordonnées ou votre adresse sont incomplètes. Retournez à la page commande.");
  }
  return cart.map(item => {
    const id = String(item.id || item.slug || item.productId || "");
    const quantity = Number(item.quantity) || 1;
    if (!/^[a-zA-Z0-9_-]+$/.test(id) || !Number.isInteger(quantity) || quantity < 1 || quantity > 10) {
      throw new Error("Un article ou une quantité du panier est invalide.");
    }
    return {id, quantity};
  });
}

async function verifyReturnedPayment() {
  const sessionId = new URLSearchParams(location.search).get("session_id");
  if (!sessionId) return false;

  document.getElementById("paymentContent").hidden = true;
  const panel = document.getElementById("successPanel");
  panel.hidden = false;
  const successMessage = document.getElementById("successMessage");
  successMessage.textContent = "Nous vérifions le statut de votre paiement...";

  try {
    const response = await fetch(API + "/checkout-session?session_id=" + encodeURIComponent(sessionId));
    const data = await response.json();
    if (!response.ok) throw new Error(data.erreur || "Vérification impossible.");
    document.getElementById("successReference").textContent =
      orderReference ? "Référence : " + orderReference : "Commande " + data.id;

    if (data.payment_status === "paid") {
      successMessage.textContent = "Votre paiement est confirmé. Merci de votre confiance.";
      localStorage.removeItem("cdc_cart");
      localStorage.removeItem("cdc_customer");
      localStorage.removeItem("cdc_shipping");
      localStorage.removeItem("cdc_promo");
      localStorage.removeItem("cdc_order_reference");
      localStorage.removeItem("cdc_order_cart_signature");
    } else {
      successMessage.textContent = "Votre paiement est en attente. Si vous avez choisi le virement bancaire, utilisez les coordonnées et la référence fournies par Stripe. La commande sera confirmée après réception des fonds.";
    }
  } catch (error) {
    successMessage.textContent = error.message || "Impossible de vérifier le paiement.";
  }
  return true;
}

async function beginPayment() {
  if (busy) return;
  busy = true;
  updateButton();
  message.classList.remove("payment-error");
  message.textContent = "Préparation de votre paiement...";

  try {
    const items = validateOrder();
    const paymentMethod = selectedMethod();
    const response = await fetch(API + "/create-checkout-session", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        items,
        orderReference,
        paymentMethod,
        customer: {
          fullName: customer.fullName,
          firstName: customer.firstName || String(customer.fullName||"").trim().split(/\s+/)[0],
          lastName: customer.lastName || String(customer.fullName||"").trim().split(/\s+/).slice(1).join(" "),
          email: customer.email,
          phone: customer.phone || "",
          address: customer.address,
          postalCode: customer.postalCode,
          city: customer.city,
          country: customer.countryCode,
          countryCode: customer.countryCode,
          countryName: customer.country
        },
        promoCode: promo.code || ""
      })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.erreur || "Impossible de préparer le paiement.");
    if (!data.checkoutUrl || !String(data.checkoutUrl).startsWith("https://checkout.stripe.com/")) {
      throw new Error("Stripe n'a pas fourni de lien de paiement sécurisé valide.");
    }

    message.textContent = "Redirection vers Stripe pour confirmer votre paiement...";
    location.assign(data.checkoutUrl);
  } catch (error) {
    console.error("CDC paiement :", error);
    showError(error.message || "Une erreur est survenue.");
  }
}

methodInputs.forEach(input => input.addEventListener("change", updateButton));
terms.addEventListener("change", updateButton);
payButton.addEventListener("click", beginPayment);

(async function init() {
  if (await verifyReturnedPayment()) return;
  message.textContent = "Choisissez votre moyen de paiement, acceptez les conditions générales, puis cliquez sur PAYER.";
  updateButton();
})();
</script>

<script src="site-shell.js?v=20261110-language-complete-v18" defer></script>
</body>
</html>
