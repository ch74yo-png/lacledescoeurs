<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#211916">
<title>Paiement | LA CLE DES COEURS</title>
<link rel="stylesheet" href="styles.css?v=20261110-email-nowrap-v17">
<script src="https://js.stripe.com/endive/stripe.js"></script>

<style>
.payment-page{
  max-width:850px;
  margin:35px auto;
  padding:20px 18px 70px;
}
.payment-title{text-align:center;margin-bottom:32px}
.payment-title h1{
  font:400 clamp(34px,5vw,47px) var(--serif);
  letter-spacing:2px;
  margin:8px 0;
}
.payment-title p:last-child{color:var(--muted)}
.payment-grid{display:block;width:100%}
.payment-card{
  width:100%;
  padding:25px;
  margin-bottom:20px;
  background:#302720;
  border:1px solid rgba(201,164,94,.55);
  color:#f3e8d8;
}
.payment-card h2{
  font:400 23px var(--serif);
  margin:0 0 20px;
  color:#e6c58e;
}
.payment-line{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin:13px 0;
  font-size:13px;
  color:#f3e8d8;
}
.payment-line strong{
  text-align:right;
  overflow-wrap:anywhere;
}
.payment-total{
  border-top:1px solid var(--gold);
  padding-top:18px;
  margin-top:20px;
  font-size:19px;
  color:#e8c78e;
}
.payment-section-intro{display:none}
#payment-element{
  margin:18px 0 25px;
  min-height:100px;
}
.pay-button{
  display:block;
  width:100%;
  min-height:52px;
  padding:16px;
  border:0;
  background:var(--gold);
  color:#211916;
  letter-spacing:3px;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
}
.pay-button:hover{background:#e2bd75}
.pay-button:disabled{opacity:.5;cursor:not-allowed}
.payment-message:empty{display:none}
.payment-message{
  font-size:12px;
  line-height:1.7;
  margin:15px 0;
  color:#c8b9a7;
}
.payment-error{color:#ffaaa0}
.payment-success{text-align:center;padding:35px 20px}
.payment-success h2{
  font:400 30px var(--serif);
}
.payment-success a{
  display:inline-block;
  margin-top:20px;
  padding:13px 25px;
  background:var(--gold);
  color:#211916;
  text-decoration:none;
  letter-spacing:1px;
  font-size:11px;
}
.payment-reference{
  padding:13px;
  margin:18px 0;
  border:1px solid rgba(201,164,94,.4);
  color:#e6c58e;
  overflow-wrap:anywhere;
}
[hidden]{display:none!important}
@media(max-width:600px){
  .payment-page{margin:18px auto;padding:12px 13px 45px}
  .payment-card{padding:18px}
}
 .payment-product-line{display:grid;grid-template-columns:76px minmax(0,1fr) auto;align-items:center;gap:12px}.payment-product-image{width:76px;height:76px;object-fit:contain;background:#111}@media(max-width:520px){.payment-product-line{grid-template-columns:58px minmax(0,1fr) auto}.payment-product-image{width:58px;height:58px}}\n</style>
</head>

<body>

<main class="payment-page">

  <div class="payment-title">
    <p class="eyebrow">BIENVENUE CHEZ LA CLE DES COEURS</p>
    <h1>MODE DE PAIEMENT</h1>
  </div>

  <div id="successPanel" class="payment-card payment-success" hidden>
    <h2>Merci pour votre commande</h2>
    <div class="payment-reference" id="successReference"></div>
    <p id="successMessage">Vérification de votre paiement...</p>
    <a href="index.html">RETOUR À L'ACCUEIL</a>
  </div>

  <div id="paymentContent" class="payment-grid">

    <section class="payment-card">
      <div class="payment-section-intro" aria-hidden="true"></div>

      <div id="payment-element"></div>

      <label class="payment-terms" style="display:flex;gap:10px;align-items:flex-start;margin:18px 0;color:#fff;font-size:12px"><input id="acceptPaymentTerms" type="checkbox" style="width:17px;height:17px;accent-color:#d9ad45"><span>J’accepte les <a href="conditions-generales.html" target="_blank" style="color:#d9ad45">conditions générales d’achat et de vente</a>.</span></label>
      <p id="paymentMessage" class="payment-message">
        
      </p>

      <button id="payButton" class="pay-button" type="button" disabled>
        PAYER
      </button>
    </section>

  </div>
</main>

<script>
"use strict";

const API = "https://cdc-paiement-api.bagzful.workers.dev";

const STRIPE_PUBLIC_KEY =
  "pk_live_51UYnKB8R9yJlbTy40jlXgQ6VY17BUzg4r1uYaO9K7DGvn6iBCZzBsqpnnjeP6craQlZXYQ6mlFh49IFE1ISJuMyf00LnUjFMgF";

const money = cents =>
  new Intl.NumberFormat("fr-FR",{
    style:"currency",
    currency:"EUR"
  }).format(Number(cents||0)/100);

const moneyEuros = euros =>
  new Intl.NumberFormat("fr-FR",{
    style:"currency",
    currency:"EUR"
  }).format(Number(euros||0));

const safe = value =>
  String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));

function readStorage(key){
  try{
    return JSON.parse(localStorage.getItem(key)||"null");
  }catch{
    return null;
  }
}

const cart=readStorage("cdc_cart")||[];
const customer=readStorage("cdc_customer")||{};
const shippingData=readStorage("cdc_shipping")||{};
const promo=readStorage("cdc_promo")||{};
const orderReference=localStorage.getItem("cdc_order_reference")||"";

const payButton=document.getElementById("payButton");
const message=document.getElementById("paymentMessage");

let checkoutActions=null;
let checkoutReady=false;
let paymentInProgress=false;
let termsAccepted=false;

function showError(text){
  message.textContent=text;
  message.classList.add("payment-error");
  payButton.disabled=true;
}

function displayCustomer(){
  document.getElementById("orderReferenceDisplay").textContent=orderReference?"N° "+orderReference:"N° indisponible";
  const rows=[
    ["Nom complet",customer.fullName],
    ["E-mail",customer.email],
    ["Téléphone",customer.phone],
    ["Adresse",customer.address],
    ["Code postal",customer.postalCode],
    ["Ville",customer.city],
    ["Pays",customer.country]
  ];

  document.getElementById("customerDetails").innerHTML=
    rows.map(([label,value])=>`
      <div class="payment-line">
        <span>${safe(label)}</span>
        <strong>${safe(value||"—")}</strong>
      </div>
    `).join("");
}

function displayCart(){
  document.getElementById("orderItems").innerHTML=
    cart.map(item=>{
      const quantity=Number(item.quantity)||1;
      const price=Number(item.price)||0;

      const image=item.image||(Array.isArray(item.images)?item.images[0]:"")||item.photo||"";
      return `
        <div class="payment-line payment-product-line">
          ${image ? `<img class="payment-product-image" src="${safe(image)}" alt="${safe(item.name||item.nom||"Article")}" loading="eager">` : ""}
          <span>${safe(item.name||item.nom||"Article")} × ${quantity}</span>
          <strong>${safe(moneyEuros(price*quantity))}</strong>
        </div>
      `;
    }).join("") || '<p class="payment-message">Panier vide.</p>';

  document.getElementById("discount").textContent=
    moneyEuros(Number(promo.discount)||0);
}

function validateBeforePayment(){
  if(!Array.isArray(cart)||!cart.length){
    throw new Error("Votre panier est vide.");
  }

  if(
    !customer.email||
    !customer.fullName||
    !customer.phone||
    !customer.address||
    !customer.postalCode||
    !customer.city||
    !customer.countryCode
  ){
    throw new Error(
      "Vos coordonnées ou votre adresse sont incomplètes. Retournez à la page commande."
    );
  }

  return cart.map(item=>{
    const id=String(
      item.id||item.slug||item.productId||""
    );
    const quantity=Number(item.quantity)||1;

    if(!/^[a-zA-Z0-9_-]+$/.test(id)){
      throw new Error(
        "Un article du panier n'a pas d'identifiant valide. Retournez au panier."
      );
    }

    if(
      !Number.isInteger(quantity)||
      quantity<1||
      quantity>10
    ){
      throw new Error("Une quantité du panier est invalide.");
    }

    return {id,quantity};
  });
}

async function verifyReturnedPayment(){
  const sessionId=
    new URLSearchParams(location.search).get("session_id");

  if(!sessionId)return false;

  document.getElementById("paymentContent").hidden=true;
  document.getElementById("successPanel").hidden=false;

  const successMessage=
    document.getElementById("successMessage");

  successMessage.textContent=
    "Nous vérifions le statut de votre paiement...";

  try{
    const response=await fetch(
      API+"/checkout-session?session_id="+
      encodeURIComponent(sessionId)
    );

    const data=await response.json();

    if(!response.ok){
      throw new Error(
        data.erreur||"Vérification impossible."
      );
    }

    if(data.payment_status==="paid"){
      location.replace("confirmation.html?session_id="+encodeURIComponent(sessionId));
      return true;
      successMessage.textContent=
        "Votre paiement est confirmé. Merci de votre confiance.";

      document.getElementById("successReference").textContent=
        orderReference
          ? "Référence : "+orderReference
          : (data.orderReference ? "Référence : "+data.orderReference : "Votre commande est confirmée.");

      localStorage.removeItem("cdc_cart");
      localStorage.removeItem("cdc_customer");
      localStorage.removeItem("cdc_shipping");
      localStorage.removeItem("cdc_promo");
      localStorage.removeItem("cdc_order_reference");
      localStorage.removeItem("cdc_order_cart_signature");

    }else{
      successMessage.textContent=
        "Le paiement n'est pas encore confirmé. Veuillez patienter ou contacter la boutique.";
    }

  }catch(error){
    successMessage.textContent=
      error.message||"Impossible de vérifier le paiement.";
  }

  return true;
}

async function startPayment(){
  try{
    if(!window.Stripe){
      throw new Error(
        "Le service de paiement Stripe n'a pas pu être chargé."
      );
    }

    const items=validateBeforePayment();

    const response=await fetch(
      API+"/create-checkout-session",
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          items,
          orderReference,
          customer:{
            fullName:customer.fullName,
            firstName:customer.firstName||String(customer.fullName||"").trim().split(/\s+/)[0],
            lastName:customer.lastName||String(customer.fullName||"").trim().split(/\s+/).slice(1).join(" "),
            email:customer.email,
            phone:customer.phone||"",
            address:customer.address,
            postalCode:customer.postalCode,
            city:customer.city,
            country:customer.countryCode,
            countryCode:customer.countryCode,
            countryName:customer.country
          },
          promoCode:promo.code||""
        })
      }
    );

    const data=await response.json();

    if(!response.ok){
      throw new Error(
        data.erreur||"Impossible de préparer le paiement."
      );
    }

    if(!data.clientSecret){
      throw new Error(
        "Stripe n'a pas fourni la référence de paiement."
      );
    }

    const stripe=Stripe(STRIPE_PUBLIC_KEY);

    const checkout=stripe.initCheckoutElementsSdk({
      clientSecret:data.clientSecret,
      elementsOptions:{
        appearance:{
          theme:"stripe",
          variables:{
            colorPrimary:"#987d60",
            colorText:"#40372f",
            borderRadius:"3px",
            fontFamily:"Arial,sans-serif"
          }
        }
      }
    });

    const loaded=await checkout.loadActions();

    if(loaded.type!=="success"){
      throw new Error(
        loaded.error?.message||
        "Impossible d'initialiser le formulaire Stripe."
      );
    }

    checkoutActions=loaded.actions;

    const paymentElement=checkout.createPaymentElement();
    paymentElement.mount("#payment-element");

    checkout.on("change",()=>{
      if(!paymentInProgress){
        // L'élément Stripe gère lui-même la validation du moyen choisi.
        // Le bouton dépend uniquement du chargement Stripe et de l'accord CGV.
        payButton.disabled=!checkoutReady||!termsAccepted;
      }
    });

    checkoutReady=true;
    payButton.disabled=!termsAccepted;

    message.textContent="";
    message.classList.remove("payment-error");

  }catch(error){
    console.error("CDC paiement :",error);
    showError(error.message||"Une erreur est survenue.");
  }
}

payButton.addEventListener("click",async()=>{
  if(
    !termsAccepted||
    !checkoutReady||
    !checkoutActions||
    paymentInProgress
  )return;

  paymentInProgress=true;
  payButton.disabled=true;
  payButton.textContent="TRAITEMENT...";

  message.textContent="Validation de votre paiement...";
  message.classList.remove("payment-error");

  try{
    const result=await checkoutActions.confirm();

    if(result && result.error){
      throw new Error(
        result.error.message||"Le paiement n'a pas pu être confirmé."
      );
    }

    // Stripe gère lui-même les authentifications et redirections bancaires
    // selon le moyen sélectionné, puis utilise le return_url de la session.
    message.textContent=
      "Demande de paiement transmise. Suivez les instructions de votre banque ou de Stripe.";

  }catch(error){
    console.error("CDC confirmation :",error);

    paymentInProgress=false;
    payButton.disabled=
      !checkoutActions.getSession().canConfirm||!termsAccepted;

    payButton.textContent="PAYER";
    message.textContent=
      error.message||"Le paiement n'a pas abouti.";

    message.classList.add("payment-error");
  }
});

document.getElementById("acceptPaymentTerms").addEventListener("change",event=>{termsAccepted=event.target.checked;if(!paymentInProgress)payButton.disabled=!checkoutReady||!termsAccepted;});

(async function init(){
  if(await verifyReturnedPayment())return;

  await startPayment();
})();
</script>

<script src="site-shell.js?v=20261110-language-complete-v18" defer></script>
</body>
</html>
