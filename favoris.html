<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Retrouvez votre sélection de bijoux et montres favoris chez LA CLÉ DES CŒURS.">
  <title>Mes favoris | LA CLÉ DES CŒURS</title>
  <link rel="stylesheet" href="styles.css?v=20261112-lisibilite-v21">

  <style>
    .favorites-page {
      max-width: 1120px;
      margin: 35px auto;
      padding: 0 18px 55px;
    }

    .favorites-heading {
      text-align: center;
      margin-bottom: 26px;
    }

    .favorites-heading h1 {
      font-family: Georgia, serif;
      font-weight: 400;
      letter-spacing: 2px;
    }

    .favorites-heading p {
      color: #827466;
      font-size: 14px;
    }

    .favorites-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .favorite-card {
      background: #000;
      border: 1px solid rgba(217,173,69,.55);
      padding-bottom: 12px;
      min-width: 0;
    }

    .favorite-image {
      height: 145px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9a8977;
      overflow: hidden;
    }

    .favorite-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .favorite-info {
      padding: 10px;
    }

    .favorite-info h2 {
      font-family: Georgia, serif;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 400;
      margin: 0 0 8px;
    }

    .favorite-price {
      color: #806b54;
      font-weight: 600;
      margin: 7px 0;
      font-size: 13px;
    }

    .favorite-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }

    .favorite-actions button {
      flex: 1;
      width: 100%;
      padding: 8px 6px;
      cursor: pointer;
      border: 1px solid #d9ad45;
      background: #000;
      color: #fff;
      font-size: 10px;
      letter-spacing: .5px;
    }

    .buy-favorite {
      background: #000;
      color: #d9ad45;
    }

    .remove-favorite {
      background: #000;
      color: #fff;
    }
    .favorite-actions button:hover,
    .favorite-actions button:focus,
    .favorite-actions button:active {
      background: #000;
      color: inherit;
      filter: none;
      opacity: 1;
    }

    .empty-favorites {
      text-align: center;
      padding: 65px 20px;
      background: #000;
      color: #fff;
      border: 1px solid rgba(217,173,69,.55);
    }

    .empty-favorites h2 {
      font-family: Georgia, serif;
      font-weight: 400;
    }

    .empty-favorites a {
      display: inline-block;
      margin-top: 15px;
      padding: 13px 24px;
      background: #000;
      color: #d9ad45;
      border: 1px solid #d9ad45;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1px;
    }

    @media (max-width: 800px) {
      .favorites-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .favorites-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .favorite-image {
        height: 112px;
      }
      .favorite-info{padding:8px}
      .favorite-info h2{font-size:12px}
      .favorite-price{font-size:12px}
      .favorite-actions button{font-size:9px;padding:7px 4px}
    }
  </style>
</head>

<body>

  <main class="favorites-page">

    <header class="favorites-heading">
      <p>LA CLÉ DES CŒURS</p>
      <h1>Mes favoris</h1>
      <p>Vos coups de cœur, réunis au même endroit.</p>
    </header>

    <div id="favoritesContainer"></div>

  </main>

  <script>
    const FAVORITES_KEY = "cdc_favorites";
    const CART_KEY = "cdc_cart";

    function getFavorites() {
      try {
        const data = JSON.parse(localStorage.getItem(FAVORITES_KEY) || "[]");
        return Array.isArray(data) ? data.filter(item => item && typeof item === "object" && (item.name || item.nom)) : [];
      } catch {
        return [];
      }
    }

    function saveFavorites(items) {
      localStorage.setItem(FAVORITES_KEY, JSON.stringify(items));
      window.dispatchEvent(new Event("cdc-favorites-updated"));
    }

    function getCart() {
      try {
        const data = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function saveCart(items) {
      localStorage.setItem(CART_KEY, JSON.stringify(items));
      window.dispatchEvent(new Event("cdc-cart-updated"));
    }

    function formatPrice(price) {
      return Number(price).toLocaleString("fr-FR", {
        style: "currency",
        currency: "EUR"
      });
    }

    function renderFavorites() {
      const favorites = getFavorites();
      const container = document.getElementById("favoritesContainer");

      container.replaceChildren();

      if (favorites.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-favorites";

        const heading = document.createElement("h2");
        heading.textContent = "Votre liste est encore vide";

        const message = document.createElement("p");
        message.textContent = "Découvrez notre collection et ajoutez vos articles préférés.";

        const link = document.createElement("a");
        link.href = "catalogue.html";
        link.textContent = "DÉCOUVRIR LA COLLECTION";

        empty.append(heading, message, link);
        container.appendChild(empty);
        return;
      }

      const grid = document.createElement("div");
      grid.className = "favorites-grid";

      favorites.forEach((product, index) => {
        const card = document.createElement("article");
        card.className = "favorite-card";

        const imageArea = document.createElement("div");
        imageArea.className = "favorite-image";

        if (product.image) {
          const image = document.createElement("img");
          image.src = product.image;
          image.alt = product.name || "Article favori";
          imageArea.appendChild(image);
        } else {
          imageArea.textContent = "LA CLÉ DES CŒURS";
        }

        const info = document.createElement("div");
        info.className = "favorite-info";

        const name = document.createElement("h2");
        name.textContent = product.name || "Article";

        const price = document.createElement("p");
        price.className = "favorite-price";

        const numericPrice = Number(product.price);
        price.textContent = Number.isFinite(numericPrice)
          ? formatPrice(numericPrice)
          : "Prix à confirmer";

        const actions = document.createElement("div");
        actions.className = "favorite-actions";

        const addButton = document.createElement("button");
        addButton.className = "buy-favorite";
        addButton.textContent = "ACHETER";
        addButton.addEventListener("click", () => {
          addToCart(product);
          window.location.href = "commande.html";
        });

        const removeButton = document.createElement("button");
        removeButton.className = "remove-favorite";
        removeButton.textContent = "RETIRER";
        removeButton.addEventListener("click", () => removeFavorite(index));

        actions.append(addButton, removeButton);
        info.append(name, price, actions);
        card.append(imageArea, info);
        grid.appendChild(card);
      });

      container.appendChild(grid);
    }

    function addToCart(product) {
      const price = Number(product.price);

      if (!Number.isFinite(price) || price < 0) {
        alert("Le prix de cet article doit être vérifié avant l'ajout au panier.");
        return;
      }

      const cart = getCart();
      const existing = cart.find(item =>
        (product.id != null && String(item.id) === String(product.id)) ||
        (item.name === product.name && Number(item.price) === price)
      );

      if (existing) {
        existing.quantity = Math.min(10, Math.max(1, Number(existing.quantity) || 1) + 1);
        if (product.id != null && existing.id == null) existing.id = product.id;
        if (product.image && !existing.image) existing.image = product.image;
      } else {
        cart.push({
          id: product.id ?? product.product_id ?? product.slug ?? product.name,
          name: product.name,
          price: price,
          quantity: 1,
          image: product.image || product.photo || ""
        });
      }

      saveCart(cart);
      window.dispatchEvent(new Event("cdc-cart-updated"));
    }

    function removeFavorite(index) {
      const favorites = getFavorites();
      favorites.splice(index, 1);
      saveFavorites(favorites);
      renderFavorites();
    }

    renderFavorites();
  </script>
<script src="site-shell.js?v=20261110-language-complete-v18" defer></script>
</body>
</html>
